<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeannot slamrap — storyboard à valider</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;--or:#f2bf44;--ok:#3cb371;--warn:#e0a030;--ko:#d9534f;--line:#2a3647}
*{box-sizing:border-box}
body{margin:0;background:#0b111c;color:#edf2f8}
header{position:sticky;top:0;background:#0b111cf2;padding:10px 16px;border-bottom:1px solid var(--line);z-index:5}
header h1{margin:0 0 6px;font-size:18px}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{color:#cbd5e1;text-decoration:none;font-size:13px;padding:2px 7px;border-radius:5px;border:1px solid var(--line)}
nav a.valide{border-color:var(--ok);color:var(--ok)} nav a.en-cours{border-color:var(--warn);color:var(--warn)}
#mode{font-size:12px;color:#8fa0b5;margin-left:8px}
main{padding:8px 16px 80px;max-width:1700px;margin:auto}
section.plan{border-bottom:1px solid var(--line);padding:16px 0}
h2{margin:0;font-size:21px} h2 .t{color:#8fa0b5;font-weight:400;font-size:15px} h2 .st{font-size:14px;margin-left:8px;font-weight:500}
.lyr{color:var(--or);margin:6px 0} .brief{color:#b5c0cf;margin:0 0 12px;max-width:1150px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:14px}
figure{margin:0;background:#121a28;border:2px solid var(--line);border-radius:9px;overflow:hidden;display:flex;flex-direction:column}
button.del{background:#fff;border:1px solid #c0392b;color:#c0392b} figure.retenue{border-color:var(--ok);box-shadow:0 0 0 2px #3cb37155} figure.ecartee{opacity:.5} figure.a-retoucher{border-color:var(--warn)}
figure img{width:100%;display:block;cursor:zoom-in;background:#05080d}
.imgw{position:relative} .imgw img.cq{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none} .imgw.cqon img.cq{display:block}
button.cqb{font-size:12px;padding:2px 8px}
figcaption{padding:9px;font-size:13px;color:#cbd5e1;display:flex;flex-direction:column;gap:7px;flex:1}
.head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.head b{font-size:15px} small{color:#8fa0b5}
.btns{display:flex;flex-wrap:wrap;gap:5px}
button{font:inherit;font-size:12px;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:#1a2435;color:#e6edf6;cursor:pointer}
button:hover{background:#233149} button.on{outline:2px solid currentColor}
button.ok{color:#7ee0a5} button.warn{color:#f5c56a} button.ko{color:#f08a86} button.send{background:#3a3010;color:var(--or);border-color:#6b5717}
textarea{width:100%;min-height:52px;resize:vertical;font:inherit;font-size:13px;background:#0d1420;color:#edf2f8;border:1px solid var(--line);border-radius:6px;padding:6px}
.avis{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.avis li{background:#0d1420;border-left:3px solid var(--or);padding:4px 7px;border-radius:4px;white-space:pre-wrap}
.avis li i{color:#8fa0b5;font-style:normal;font-size:11px;display:block}
.libre{margin-top:12px;background:#111a29;border:1px dashed #44536a;border-radius:9px;padding:10px;max-width:1150px}
.libre h3{margin:0 0 6px;font-size:14px;color:var(--or)}
.row{display:flex;gap:6px;align-items:flex-end} .row textarea{flex:1}
#zoom{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:10;cursor:zoom-out}
#zoom img{max-width:98vw;max-height:96vh}
#zoomvue{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;z-index:11;padding:8px;gap:6px}
#zoomvue .zh{display:flex;gap:10px;align-items:center;color:#cbd5e1;font-size:14px} #zoomvue .zh b{color:var(--or)}
#zoomvue iframe{flex:1;width:100%;border:1px solid var(--line);border-radius:8px;background:#0b111c}
.vuemini{position:relative;width:360px;max-width:45%;aspect-ratio:16/9;border-radius:5px;overflow:hidden;cursor:zoom-in;background:#1b2636;flex:none}
.vuemini iframe{width:100%;height:100%;border:0;pointer-events:none}
.vuemini span{position:absolute;left:6px;bottom:5px;font-size:12px;background:#000a;color:#f2bf44;padding:2px 7px;border-radius:5px}
.bdg{font-size:12px;padding:2px 7px;border-radius:5px;align-self:flex-start}
.bdg.vert{background:#123824;color:#7ee0a5} .bdg.orange{background:#3d2a0c;color:#f5c56a} .bdg.gris{background:#1d2633;color:#9fb0c4}
.carteplan{display:flex;gap:12px;align-items:flex-start;background:#111a29;border:1px solid var(--line);border-radius:8px;padding:8px;margin:0 0 12px;max-width:1150px;font-size:13px;color:#cbd5e1}
.carteplan img{width:360px;max-width:45%;border-radius:5px;cursor:zoom-in} .carteplan a{color:var(--or)} .carteplan.vide{color:#9fb0c4}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1d2a3e;border:1px solid var(--line);padding:8px 14px;border-radius:8px;display:none;z-index:11}
</style>
</head>
<body>
<header>
  <h1>Storyboard — options à valider <span id="mode"></span>
    <a href="carte.html" style="font-size:14px;color:#f2bf44;margin-left:12px">🗺️ Carte interactive (caméra, persos, véhicules par plan) →</a></h1>
  <nav id="nav"></nav>
</header>
<main id="main">Chargement…</main>
<div id="zoom"><img alt=""></div>
<div id="zoomvue"><div class="zh">👁️ <b id="zvt"></b> vue de la caméra calculée depuis la carte (lecture seule — rien n'est modifié)<span style="flex:1"></span><a id="zve" href="#" style="color:#f2bf44">✏️ ouvrir dans la carte interactive</a><button id="zvx">✕ fermer (Échap)</button></div><iframe title="vue caméra"></iframe></div>
<div id="toast"></div>
<script>
const MANIFEST = '../assets/storyboards/a-valider/options.json';
const ST = {"a-valider":"⏳ À valider","en-cours":"🛠️ En cours","valide":"✅ Validé"};
const ET = {"a-valider":"⏳ à valider","retenue":"✅ retenue","ecartee":"❌ écartée","a-retoucher":"🔁 à retoucher"};
let canWrite = false, man = null, CPLANS = {}, LREV = 1;
const CARTE_DIR = '../assets/storyboards/a-valider/carte';
function badge(p, o){
  if (!/^P\d/.test(p.plan)) return '';
  const cp = CPLANS[p.plan];
  if (!o.carte) return '<span class="bdg gris">⚪ faite sans carte du plan</span>';
  if (cp && o.carte.plan_rev === cp.rev && o.carte.lieux_rev === LREV) return `<span class="bdg vert">🟢 conforme à la carte actuelle (rév. ${cp.rev})</span>`;
  return `<span class="bdg orange">🟠 faite d'après la carte rév. ${o.carte.plan_rev} — la carte a changé depuis${cp?` (rév. ${cp.rev})`:''}</span>`;
}
function carteBox(p){
  if (!/^P\d/.test(p.plan)) return p.plan==='CARTE' ? `<p class="brief"><a href="carte.html">🗺️ Ouvrir la carte interactive</a> (les lieux validés servent de base à tous les plans)</p>` : '';
  const cp = CPLANS[p.plan];
  if (!cp) return `<div class="carteplan vide">🗺️ Pas encore de carte pour ce plan — <a href="carte.html#${p.plan}">la placer sur la carte interactive</a></div>`;
  const src = `${CARTE_DIR}/plans/${p.plan.toLowerCase()}.png?r=${cp.rev}-${LREV}`;
  return `<div class="carteplan"><img loading="lazy" src="${src}" alt="carte ${p.plan}"><div class="vuemini" data-vue="${p.plan}" title="Agrandir la vue caméra (sans modifier la carte)"><iframe loading="lazy" tabindex="-1" src="carte.html?vue=mini#${p.plan}"></iframe><span>⤢ vue caméra — agrandir</span></div><div>🗺️ <b>Carte du plan</b> · rév. ${cp.rev} · ${esc(cp.maj||'')}<br><a href="carte.html#${p.plan}">✏️ modifier la caméra / les personnages</a>${cp.note?`<br><i>${esc(cp.note)}</i>`:''}</div></div>`;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast = m => { const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2600); };
const avisList = a => (a&&a.length) ? `<ul class="avis">${a.map(x=>`<li><i>${esc(x.date)}</i>${esc(x.texte)}</li>`).join('')}</ul>` : '';

const SHOW_EC = new Set();
function render(){
  const drafts = Object.fromEntries([...document.querySelectorAll('textarea')].map(t=>[t.id,t.value]));
  document.getElementById('nav').innerHTML = man.plans.map(p=>`<a class="${p.statut}" href="#${p.plan.toLowerCase()}">${p.plan}</a>`).join('');
  document.getElementById('main').innerHTML = man.plans.map(p=>{
    const nEc = p.options.filter(o=>o.etat==='ecartee').length;
    const opts = p.options.filter(o=>o.etat!=='ecartee'||SHOW_EC.has(p.plan)).map(o=>{
      const src = `../assets/storyboards/a-valider/${p.plan.toLowerCase()}/${o.fichier}`;
      const key = `${p.plan}-${o.id}`;
      const b = (etat, cls, label) => `<button class="${cls} ${o.etat===etat?'on':''}" data-plan="${p.plan}" data-opt="${o.id}" data-etat="${etat}">${label}</button>`;
      return `<figure class="${o.etat}" id="f-${key}">
        <div class="imgw" id="w-${key}"><img loading="lazy" src="${esc(src)}" alt="${key}">${CPLANS[p.plan]?`<img class="cq" src="${CARTE_DIR}/plans/${p.plan.toLowerCase()}-calque.png?r=${CPLANS[p.plan].rev}-${LREV}" alt="">`:''}</div>
        <figcaption>
          <div class="head"><b>${esc(o.id)}</b><span>${ET[o.etat]||esc(o.etat)}</span></div>
          <small>${esc(o.source)}</small>
          ${badge(p, o)}
          ${CPLANS[p.plan]?`<div><button class="cqb" data-cq="${key}" title="Superpose ce que la caméra de la carte doit voir : position et taille de chaque élément">📐 Calque de la carte (rév. ${CPLANS[p.plan].rev})</button></div>`:''}
          <div>${esc(o.note)}</div>
          ${avisList(o.avis)}
          ${canWrite ? `<div class="btns">${b('retenue','ok','✅ Je choisis')}${b('a-retoucher','warn','🔁 À retoucher')}${b('ecartee','ko','❌ Écarter')}${b('a-valider','','⏳ Remettre')}<button class="del" data-plan="${p.plan}" data-opt="${o.id}" title="Supprimer définitivement cette version (image effacée, plus dans l'historique)">🗑️ Supprimer</button></div>
          <div class="row"><textarea id="t-${key}" placeholder="Ton avis, les détails à changer…"></textarea><button class="send" data-plan="${p.plan}" data-opt="${o.id}">Envoyer</button></div>` : ''}
        </figcaption></figure>`;
    }).join('');
    return `<section class="plan" id="${p.plan.toLowerCase()}">
      <h2>${esc(p.plan)} <span class="t">${esc(p.temps)}</span><span class="st">${ST[p.statut]||esc(p.statut)}${p.choix?` · choix : ${esc(p.choix)}`:''}</span></h2>
      <p class="lyr">${esc(p.paroles)}</p><p class="brief">${esc(p.brief)}</p>
      ${carteBox(p)}
      <div class="grid">${opts}</div>
      ${nEc?`<p class="brief"><button class="toggle-ec" data-plan="${p.plan}">${SHOW_EC.has(p.plan)?'🙈 Masquer':'🗄️ Voir'} les ${nEc} option(s) écartée(s)</button> <small>(cachées par défaut, gardées dans l'historique)</small></p>`:''}
      <div class="libre"><h3>💡 Autre idée / avis libre sur le plan ${esc(p.plan)}</h3>
        ${avisList(p.avis)}
        ${canWrite ? `<div class="row"><textarea id="t-${p.plan}" placeholder="Ce que tu veux : une autre version, une idée de cadrage, un détail pour tout le plan…"></textarea><button class="send" data-plan="${p.plan}">Envoyer</button></div>` : ''}
      </div></section>`;
  }).join('');
  for (const [id,v] of Object.entries(drafts)) { const t=document.getElementById(id); if(t) t.value=v; }
}

async function post(body){
  const r = await fetch('/api/avis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j = await r.json();
  if(!j.ok) throw new Error(j.erreur||'erreur');
  man = j.manifest; render(); toast('Enregistré ✔ (sauvegardé dans le dépôt)');
}

function ouvreVue(plan){ const z=document.getElementById('zoomvue'); z.dataset.plan=plan; document.getElementById('zvt').textContent=plan;
  z.querySelector('iframe').src='carte.html?vue&t='+Date.now()+'#'+plan; z.style.display='flex'; }
function fermeVue(){ const z=document.getElementById('zoomvue'); z.style.display='none'; z.querySelector('iframe').src='about:blank'; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ fermeVue(); document.getElementById('zoom').style.display='none'; } });
document.addEventListener('click', async e=>{
  const el = e.target;
  if (el.tagName==='IMG' && el.closest('figure, .carteplan')) { const z=document.getElementById('zoom'); z.querySelector('img').src=el.src; z.style.display='flex'; return; }
  if (el.closest('#zoom')) { document.getElementById('zoom').style.display='none'; return; }
  const vm = el.closest('.vuemini'); if (vm) { ouvreVue(vm.dataset.vue); return; }
  if (el.id==='zvx') { fermeVue(); return; }
  if (el.id==='zve') { e.preventDefault(); location.href='carte.html#'+document.getElementById('zoomvue').dataset.plan; return; }
  if (el.tagName!=='BUTTON') return;
  if (el.dataset.cq) { const w=document.getElementById('w-'+el.dataset.cq); w.classList.toggle('cqon'); el.classList.toggle('on'); return; }
  if (el.classList.contains('toggle-ec')) { const p=el.dataset.plan; SHOW_EC.has(p)?SHOW_EC.delete(p):SHOW_EC.add(p); render(); return; }
  const plan=el.dataset.plan, option=el.dataset.opt||null;
  if (el.classList.contains('del')) {
    if (!confirm(`Supprimer définitivement ${plan} ${option} ?\nL'image est effacée et la version disparaît aussi de l'historique des écartées.`)) return;
    try{ await post({plan, option, supprimer:true}); toast(`${plan} ${option} supprimée ✔`); }catch(err){ toast('Erreur : '+err.message); }
    return;
  }
  try{
    if (el.dataset.etat) {
      const t=document.getElementById(`t-${plan}-${option}`);
      await post({plan, option, etat: el.dataset.etat, texte: t ? t.value : ''});
    } else if (el.classList.contains('send')) {
      const t=document.getElementById(option?`t-${plan}-${option}`:`t-${plan}`);
      if(!t.value.trim()) return toast('Écris quelque chose avant d’envoyer');
      await post({plan, option, texte: t.value});
    }
  }catch(err){ toast('Erreur : '+err.message); }
});

(async()=>{
  try { const r = await fetch('/api/manifest',{cache:'no-store'}); if(!r.ok) throw 0; man = await r.json(); canWrite = true; }
  catch { man = await (await fetch(MANIFEST,{cache:'no-store'})).json(); }
  try {
    const [cp, lx] = await Promise.all([`${CARTE_DIR}/plans.json`, `${CARTE_DIR}/lieux.json`].map(u => fetch(u, {cache:'no-store'}).then(r => r.ok ? r.json() : {})));
    CPLANS = cp || {}; LREV = (lx && lx.rev) || 1;
  } catch {}
  document.getElementById('mode').textContent = canWrite ? '· avis activés' : '· lecture seule (lancer tools/serve_storyboard.py pour donner des avis)';
  render();
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
})();
</script>
</body>
</html>
